# MXtreme configuration.
#
# `root` is the package-managed data store: where preprocessing writes its outputs
# (cleaned .npz files, experimental-condition CSVs, the registry) and later reads them back.
# Raw .h5 inputs are NOT resolved through here -- you point at those by explicit path.
#
# Edit `root` to a location you can write to.

[data]
root = "../../mxtreme-claude/claude_output"
