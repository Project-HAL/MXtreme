name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Let a newer commit cancel an in-flight build, but never interrupt an in-flight deploy.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked fails on a stale lock file rather than silently re-resolving.
      - name: Install
        run: uv sync --locked --group docs

      # -W: the build is warning-clean today, so keep it that way -- a malformed docstring or a
      # broken :class:/:meth: cross-reference fails the PR instead of silently shipping a dead link.
      - name: Build
        run: uv run sphinx-build -b html -W --keep-going docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # Publishes to https://project-hal.github.io/MXtreme/ on every merge to `main`. The one piece of
  # setup that lives outside this file is Settings -> Pages -> Source = "GitHub Actions".
  # On pull requests this job is *skipped*, not failed, while `build` still verifies the docs and
  # leaves the rendered site downloadable as a workflow artifact.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
